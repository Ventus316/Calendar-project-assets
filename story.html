<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>難哄・選集</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
    <link rel="stylesheet" href="./assets/css/episode.css">
    <link rel="stylesheet" href="./assets/css/story.css">
</head>
<body>
    <!-- 背景：焦點那一集的封面，模糊後鋪滿 -->
    <div class="backdrop" aria-hidden="true">
        <div class="backdrop-layer" id="backdrop-a"></div>
        <div class="backdrop-layer" id="backdrop-b"></div>
    </div>

    <header class="topbar">
        <p class="brand" id="brand">難哄 <span>32 DAYS</span></p>
        <a class="mode-link" href="./index.html">日曆模式</a>
    </header>

    <main class="stage">
        <section class="hero" aria-live="polite">
            <p class="hero-meta" id="hero-meta"></p>
            <h1 class="hero-title" id="hero-title"></h1>
            <p class="hero-state" id="hero-state"></p>
        </section>

        <div class="rail-wrap">
            <div class="rail" id="rail" role="group" aria-label="32 集選集，用左右方向鍵切換"></div>
            <div class="rail-progress" aria-hidden="true"><div id="rail-progress-bar"></div></div>
        </div>
    </main>

    <!-- 轉場、當集內容、彩蛋圖全螢幕由 episode.js 建立（和日曆頁共用） -->

    <div id="toast" role="status" aria-live="polite"></div>

    <div id="finale" role="dialog" aria-modal="true" aria-labelledby="finale-title" hidden>
        <div class="finale-card">
            <p class="finale-range" id="finale-range"></p>
            <h2 id="finale-title">32 天，全部走完了</h2>
            <p class="finale-text">從重逢到圓滿，謝謝你每天回來打開一格。</p>
            <p class="finale-hint" id="finale-hint"></p>
            <button id="finale-close" type="button">回到選集</button>
        </div>
    </div>

    <!-- 開發者模式：連點左上角「難哄」5 次 -->
    <div id="debug-panel">
        <h3>🔧 開發者測試面板</h3>
        <p>設定 Day 1 起始日期：</p>
        <div class="debug-controls">
            <input type="date" id="debug-date-input">
            <button type="button" id="debug-apply">確認修改</button>
        </div>
        <p class="debug-hint">選集將以該日期作為第 1 天重新排列，所有集數都能打開。</p>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/progress.js"></script>
    <script src="./assets/js/episode.js"></script>
    <script src="./assets/js/story.js"></script>
</body>
</html>
